services:
  - type: web
    name: studyflow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix frontend --include=dev && npm ci --prefix frontend/backend && npm run build --prefix frontend -- --outDir ../dist
    startCommand: npm --prefix frontend/backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
